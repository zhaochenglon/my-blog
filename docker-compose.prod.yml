services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: blog_db
      TZ: Asia/Shanghai
    volumes:
      - blog_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 25s

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  blog-api-1:
    build:
      context: ./blog-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:8080"   # 实例 1
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=blog_db;User=root;Password=${MYSQL_ROOT_PASSWORD};
      ConnectionStrings__Redis: redis:6379
      Admin__ApiKey: ${ADMIN_API_KEY}
      Admin__Username: ${ADMIN_USERNAME}
      Admin__Password: ${ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  blog-api-2:
    build:
      context: ./blog-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:5002:8080"   # 实例 2
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=mysql;Port=3306;Database=blog_db;User=root;Password=${MYSQL_ROOT_PASSWORD};
      ConnectionStrings__Redis: redis:6379
      Admin__ApiKey: ${ADMIN_API_KEY}
      Admin__Username: ${ADMIN_USERNAME}
      Admin__Password: ${ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  blog_mysql_data: