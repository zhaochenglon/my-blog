# CD：main 分支 CI 通过后，推送镜像到阿里云 ACR 并 SSH 部署到云服务器
#
# 每次部署会：
# 1. 在 Actions 侧打包 CI 通过的代码，SCP 到服务器 DEPLOY_PATH（避免国内机访问 GitHub 失败）
# 2. 将 blog/ 静态前端同步到 /var/www/blog（保留服务器上已有的 js/config.js）
# 3. 从 ACR pull 新 API 镜像并滚动更新 blog-api-1 / blog-api-2
#
# 前置条件（一次性配置）：
# 1. 阿里云 ACR 个人版：创建实例 → 创建命名空间 → 创建仓库 blog-api（建议私有）
# 2. ACR 访问凭证：控制台「访问凭证」设置固定密码
# 3. 云服务器：DEPLOY_PATH 为部署目录（含 .env、docker-compose.replica.yml）；执行一次 docker login 登录 ACR
#    前端目录 /var/www/blog 已初始化，且存在 js/config.js（生产 API 地址，勿提交 Git）
# 4. GitHub Secrets（Settings → Secrets and variables → Actions）：
#    ACR_REGISTRY      例：registry.cn-hangzhou.aliyuncs.com（与服务器同地域）
#    ACR_NAMESPACE     例：blog-demo
#    ACR_USERNAME      阿里云账号或 RAM 用户名
#    ACR_PASSWORD      ACR 固定密码
#    SSH_HOST          云服务器公网 IP
#    SSH_USER          SSH 用户名，例：admin
#    SSH_PRIVATE_KEY   部署用私钥（PEM 全文）
#    DEPLOY_PATH       可选，默认 /home/admin/blog-project
#    FRONTEND_PATH     可选，默认 /var/www/blog
# 5. 服务器 .env 增加（镜像地址与 ACR 仓库一致）：
#    BLOG_API_IMAGE=crpi-xxx.cn-shenzhen.personal.cr.aliyuncs.com/blog-demo/blog-api:latest
# 6. 生产使用主从库时，CD 部署 docker-compose.replica.yml（勿用 prod.yml 里的单库 mysql）

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  push-and-deploy:
    name: Push to ACR and deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    env:
      IMAGE_NAME: blog-api
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/admin/blog-project' }}
      FRONTEND_PATH: ${{ secrets.FRONTEND_PATH || '/var/www/blog' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout (CI 通过的 commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set image tags
        id: meta
        run: |
          REGISTRY="${{ secrets.ACR_REGISTRY }}"
          NAMESPACE="${{ secrets.ACR_NAMESPACE }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA:0:7}"
          IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:latest,${IMAGE}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./blog-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Pack deploy bundle
        run: |
          tar czf deploy-bundle.tar.gz \
            blog \
            docker-compose.replica.yml \
            docker-compose.prod.yml

      - name: Upload deploy bundle to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: deploy-bundle.tar.gz
          target: /tmp/

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="${{ env.DEPLOY_PATH }}"
            FRONTEND_PATH="${{ env.FRONTEND_PATH }}"
            COMPOSE_FILE=docker-compose.replica.yml

            echo "Deploying commit ${{ env.DEPLOY_SHA }}"

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # 解压 Actions 上传的部署包（与 CI 通过的 commit 一致，无需服务器访问 GitHub）
            tar xzf /tmp/deploy-bundle.tar.gz
            rm -f /tmp/deploy-bundle.tar.gz

            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "ERROR: $DEPLOY_PATH 缺少 $COMPOSE_FILE"
              exit 1
            fi

            # 同步静态前端；保留服务器上的 config.js（生产 API 地址，未纳入 Git）
            sudo cp "$FRONTEND_PATH/js/config.js" /tmp/blog-config.js.bak 2>/dev/null || true
            sudo mkdir -p "$FRONTEND_PATH"
            sudo cp -r blog/* "$FRONTEND_PATH/"
            if [ -f /tmp/blog-config.js.bak ]; then
              sudo cp /tmp/blog-config.js.bak "$FRONTEND_PATH/js/config.js"
            fi
            sudo nginx -t
            sudo systemctl reload nginx

            # 主从环境：确保 mysql-master / mysql-slave / redis 在跑，再更新 API
            sudo docker compose -f "$COMPOSE_FILE" up -d mysql-master mysql-slave redis
            sudo docker compose -f "$COMPOSE_FILE" pull blog-api-1 blog-api-2
            sudo docker compose -f "$COMPOSE_FILE" up -d blog-api-1 blog-api-2
            sudo docker compose -f "$COMPOSE_FILE" ps
